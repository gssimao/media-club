services:
  media-club:
    build: .
    container_name: media-club
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:/app/data/media-club.db
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      SESSION_SECRET: replace-with-a-long-random-string
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
