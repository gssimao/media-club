services:
  media-club:
    build: .
    container_name: media-club
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:/app/data/media-club.db
      # Set these in a .env file next to this compose file (see .env.example).
      # The build fails fast instead of shipping a default password.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env before starting}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      DEFAULT_ROUTE: ${DEFAULT_ROUTE:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
